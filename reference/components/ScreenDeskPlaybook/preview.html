ject with the signed contracts in it (scanned PDFs are fine) and the calendar.","impact":["9%","of a contract's value is lost, on average, to poor contract management"],"stake":"It stops contracts renewing on their own when nobody chose to keep them. (The 9% is an older, widely quoted figure.)","src":[["World Commerce & Contracting, via Juro","https://juro.com/learn/contract-value-leakage"]],"steps":[{"label":"Read each contract and pull out its dates and terms"},{"label":"Build the renewal calendar"},{"label":"Warn you 60 and 30 days before each notice deadline"},{"label":"Choose which to end or renegotiate","detail":null,"approval":true,"approvalLabel":"You pick which to end"},{"label":"Draft the notice letters","detail":"To the notice address in each contract"},{"label":"Send the letters","detail":null,"approval":true,"approvalLabel":"You approve before they go"}],"owner":"Han Jiwoo","runs":"run 34 times","lastRun":"Today, 08:14","team":true,"cadence":"Every Monday, 08:00 KST"}];

tacts, deals and email history."},{"id":"jira","name":"Jira","maker":"Atlassian","cat":"Project tracking","icon":"kanban","does":"Reads tickets and sprints, and drafts new tickets and updates."},{"id":"confluence","name":"Confluence","maker":"Atlassian","cat":"Docs and notes","icon":"book","does":"Reads your team's pages and drafts new ones."},{"id":"docusign","name":"Docusign","maker":"Docusign","cat":"E-signature","icon":"signature","on":true,"does":"Checks where each agreement stands and prepares envelopes."},{"id":"box","name":"Box","maker":"Box","cat":"Files","icon":"folderPlus","does":"Finds and reads files in the folders you choose."},{"id":"asana","name":"Asana","maker":"Asana","cat":"Project tracking","icon":"checklist","does":"Reads projects and tasks, and drafts updates and new tasks."},{"id":"quickbooks","name":"QuickBooks","maker":"Intuit","cat":"Accounting","icon":"receipt","does":"Reads invoices, bills and reports, and drafts entries."},{"id":"zoho","name":"Zoho","maker":"Zoho","cat":"CRM, mail and books","icon":"building","does":"Reads CRM records, invoices and mail, and drafts changes."}];
