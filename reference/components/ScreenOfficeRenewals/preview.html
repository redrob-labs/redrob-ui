<!-- @dsCard group="Product screens" height=1350 width=1320 page -->
<div id="root" style="font-family: var(--font-sans); color: var(--ink-primary);"></div>
<style>
  .con { background: var(--surface-base); min-height: 1340px; }
  .con__top { display: flex; align-items: center; justify-content: space-between; gap: 16px;
              padding: 14px 28px; border-bottom: 1px solid var(--border-subtle); }
  .con__brand { display: flex; align-items: center; gap: 14px; }
  .con__brand img { height: 18px; width: auto; display: block; }
  .con__brand .rr-mark { flex: none; }
  .con__where { font-size: 13px; color: var(--ink-secondary); }
  .con__body { padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 20px; }
  .con__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .con__h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
  .con__filters { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .con__filters > * { min-width: 0; }
  .con__foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .con__count { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
  .con__two { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 24px; align-items: start; }
  .con__panel { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px; }
  .con__panelhead { font-size: 12px; font-weight: 600; color: var(--ink-muted); margin: 0 0 12px; }
  @media (max-width: 1080px) { .con__two { grid-template-columns: minmax(0,1fr); } }
</style>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;

  const rows = [
    { id: 'MRC-2024-0118', party: '주식회사 한미글로벌엔지니어링건설', country: 'KR',
      owner: '박영수', renews: '2026-10-02', notice: 60, value: '₩ 412,800,000', state: 'inside' },
    { id: 'MRC-2024-0091', party: 'Daejin Precision Components and Tooling Pvt. Ltd.', country: 'IN',
      owner: 'John Stiles', renews: '2026-10-09', notice: 60, value: '₹ 2,84,00,000', state: 'inside' },
    { id: 'MRC-2024-0140', party: '디에스이엔지니어링주식회사', country: 'KR',
      owner: '박영수', renews: '2026-11-14', notice: 90, value: '₩ 88,000,000', state: 'watch' },
    { id: 'MRC-2024-0077', party: 'Northbridge Facilities Management LLC', country: 'US',
      owner: 'Mary Major', renews: '2026-11-30', notice: 30, value: '$ 240,000', state: 'watch' },
    { id: 'MRC-2024-0163', party: '한국산업안전보건공단 위탁운영', country: 'KR',
      owner: '박영수', renews: '2027-01-08', notice: 90, value: '₩ 1,204,500,000', state: 'ok' },
    { id: 'MRC-2024-0022', party: 'Meridian Logistics', country: 'US',
      owner: 'Mary Major', renews: '2027-02-19', notice: 30, value: '$ 61,200', state: 'ok' }
  ];

  const TONE = { inside: ['danger', 'Inside 60 days'], watch: ['warning', 'Watch'], ok: ['neutral', 'Fine'] };

  const columns = [
    { key: 'id', header: 'Reference' },
    { key: 'party', header: 'Counterparty', grow: true, wrap: true,
      lang: function (r) { return r.country === 'KR' ? 'ko' : undefined; } },
    { key: 'owner', header: 'Owner', lang: function (r) { return /[\uAC00-\uD7A3]/.test(r.owner) ? 'ko' : undefined; } },
    { key: 'renews', header: 'Renews' },
    { key: 'notice', header: 'Notice', align: 'right', render: function (r) { return r.notice + ' days'; } },
    { key: 'value', header: 'Annual value', money: true },
    { key: 'state', header: 'Status', render: function (r) {
        return h(R.Badge, { tone: TONE[r.state][0], variant: 'subtle', dot: true }, TONE[r.state][1]); } }
  ];

  function Screen() {
    return h('div', { className: 'con' }, [
      h('div', { className: 'con__top', key: 't' }, [
        h('div', { className: 'con__brand', key: 'b' }, [
          h(R.Mark, { key: 'm', height: 18, src: '/_blob/4acde94cf2db0da7cc2c123d4cafbb66', darkSrc: '/_blob/9d0341656bedf8aaacf9584371167cb2' }),
          h('span', { className: 'con__where', key: 'w' }, 'Contracts')
        ]),
        h('div', { key: 'a', style: { display: 'flex', gap: '8px', alignItems: 'center' } }, [
          h(R.Badge, { key: 'e', tone: 'neutral', variant: 'outline', size: 'sm' }, 'Staging'),
          h(R.Avatar, { key: 'v', name: 'John Doe', size: 'sm' })
        ])
      ]),
      h('div', { className: 'con__body', key: 'b' }, [

        h(R.Alert, { key: 'al', tone: 'warning', title: 'Two files could not be read',
          action: h(R.Button, { size: 'sm', variant: 'secondary' }, 'Show me which') },
          'HANMI-addendum.pdf and DSE-2024-11.pdf are scans with no text in them. They are not counted below.'),

        h('div', { className: 'con__head', key: 'hd' }, [
          h('div', { key: 'l' }, [
            h('h1', { className: 'con__h1', key: 'h' }, 'Renewals'),
            h('p', { key: 'p', style: { margin: '4px 0 0', fontSize: '13px', color: 'var(--ink-secondary)' } },
              '39 contracts read on 24 September. Nine renew on their own inside 60 days.')
          ]),
          h('div', { className: 'con__filters', key: 'f' }, [
            h('div', { key: 'q', style: { width: '210px' } },
              h(R.Input, { placeholder: 'Reference or counterparty' })),
            h('div', { key: 'o', style: { width: '190px' } },
              h(R.Combobox, { options: ['Everyone', '박영수', 'John Stiles', 'Mary Major'],
                defaultValue: 'Everyone', placeholder: 'Owner' })),
            h('div', { key: 'c', style: { width: '160px' } },
              h(R.Combobox, { options: ['All three', 'Korea', 'India', 'United States'],
                defaultValue: 'All three', placeholder: 'Entity' })),
            h(R.Button, { key: 'x', variant: 'secondary' }, 'Export')
          ])
        ]),

        h(R.Table, { key: 'tb', columns: columns, rows: rows, dense: true,
          caption: 'Contracts read on 24 September, soonest renewal first' }),

        h('div', { className: 'con__foot', key: 'ft' }, [
          h('span', { className: 'con__count', key: 'c' }, 'Showing 6 of 39'),
          h(R.Pagination, { key: 'p', page: 1, pageCount: 7 })
        ]),

        h('div', { className: 'con__two', key: 'tw' }, [
          h('div', { className: 'con__panel', key: 'e' }, [
            h('p', { className: 'con__panelhead', key: 'h' }, 'Flagged by you'),
            h(R.EmptyState, { key: 'e', icon: h(I.flag, { width: 22, height: 22 }),
              title: 'Nothing flagged yet',
              description: 'Flag a contract here and it stays on this list until you clear it. Flags are yours, not the workspace’s.',
              action: h(R.Button, { size: 'sm', variant: 'secondary' }, 'How flagging works'), compact: true })
          ]),
          h('div', { className: 'con__panel', key: 's' }, [
            h('p', { className: 'con__panelhead', key: 'h' }, 'Counterparty history'),
            h('div', { key: 'sk', style: { display: 'flex', flexDirection: 'column', gap: '10px' } }, [
              h(R.Skeleton, { key: 1, variant: 'text', lines: 3 }),
              h(R.Skeleton, { key: 2, variant: 'rect', height: 64 })
            ]),
            h('p', { key: 'n', style: { margin: '12px 0 0', fontSize: '12px', color: 'var(--ink-muted)' } },
              'Reading 39 files. About 20 seconds left.')
          ])
        ]),

        h(R.Alert, { key: 'er', tone: 'danger', title: 'The India entity did not answer',
          action: h(R.Button, { size: 'sm', variant: 'secondary' }, 'Try again') },
          'Six Daejin contracts are missing from this list. Nothing has been changed. The last good read was 09:12 KST.')
      ])
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Screen));
</script>
