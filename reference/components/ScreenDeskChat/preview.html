<style>
  #root, .rr-shell { min-height: 1000px; }
  /* The three pages share one layout: a large status card, the figures, then sections. */
  .page { display: flex; flex-direction: column; gap: 56px; padding: 12px 0 72px; max-width: 920px; }
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin: -24px 0 0;
          border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); }
  .fig { padding: 20px 24px 20px 0; }
  .fig + .fig { padding-left: 24px; border-left: 1px solid var(--border-subtle); }
  .fig dt { font-size: 13px; line-height: 19px; color: var(--ink-secondary); }
  .fig dd { margin: 6px 0 0; font-size: 32px; line-height: 38px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sec { display: flex; flex-direction: column; gap: 20px; }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
  .cols--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .col b { display: block; font-size: 15px; line-height: 22px; font-weight: 600; margin-bottom: 6px; }
  .col p { margin: 0; font-size: 14px; line-height: 23px; color: var(--ink-secondary); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; counter-reset: s; }
  .steps li { counter-increment: s; font-size: 14px; line-height: 23px; color: var(--ink-secondary); }
  .steps li::before { content: counter(s); display: inline-flex; width: 26px; height: 26px; margin-bottom: 10px; align-items: center; justify-content: center;
                      border-radius: 50%; background: var(--surface-sunken); font-size: 12px; font-weight: 600; color: var(--ink-primary); }
  .steps b { display: block; font-size: 15px; margin-bottom: 4px; color: var(--ink-primary); }
  .bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
  .admin { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-secondary); }
  .thread { display: flex; flex-direction: column; gap: 18px; }
  .note { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; line-height: 20px; color: var(--ink-secondary); }
  .note > span:first-child { display: inline-flex; color: var(--status-success); }
  .note a { font-weight: 600; color: var(--ink-brand); text-decoration: none; }
  .answer p { margin: 0 0 10px; } .answer p:last-child { margin: 0; }
  @media (max-width: 720px) {
    .page { gap: 40px; } .figs, .cols, .cols--2, .steps { grid-template-columns: minmax(0, 1fr); }
    .fig + .fig { padding-left: 0; border-left: 0; border-top: 1px solid var(--border-subtle); }
  }
