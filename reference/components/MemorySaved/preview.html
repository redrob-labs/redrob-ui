<div id="root" style="padding: 32px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  const ic = (n, s) => h(I[n], { width: s || 15, height: s || 15 });

  function Demo() {
    const [gone, setGone] = React.useState(false);
    return h('div', { style: { maxWidth: '760px' } }, gone
      ? h('p', { style: { fontSize: '13px', color: 'var(--ink-secondary)' } }, 'Removed from memory.')
      : h(R.MemorySaved, { onUndo: () => setGone(true) }, 'your standard notice period is 60 days'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
