roject with the signed contracts in it (scanned PDFs are fine) and the calendar.","impact":["9%","of a contract's value is lost, on average, to poor contract management"],"stake":"It stops contracts renewing on their own when nobody chose to keep them. (The 9% is an older, widely quoted figure.)","src":[["World Commerce & Contracting, via Juro","https://juro.com/learn/contract-value-leakage"]],"steps":[{"label":"Read each contract and pull out its dates and terms"},{"label":"Build the renewal calendar"},{"label":"Warn you 60 and 30 days before each notice deadline"},{"label":"Choose which to end or renegotiate","detail":null,"approval":true,"approvalLabel":"You pick which to end"},{"label":"Draft the notice letters","detail":"To the notice address in each contract"},{"label":"Send the letters","detail":null,"approval":true,"approvalLabel":"You approve before they go"}],"owner":"Jane Major","runs":"run 34 times","lastRun":"Today, 08:14","team":true,"cadence":"Every Monday, 08:00 KST"},{"id":"invoice-match","p":"accountant","high":true,"name":"Invoice check and coding","icon":"invoice","purpose":"Use it every day on the supplier invoices that land in the finance inbox.","summary":"Desk reads each invoice, matches it with its purchase order and receipt, and codes it to the right account. Before anything is paid, it flags duplicates, changed bank details and senders that do not look right.","gets":"A list of invoices ready to post, and a short list set aside, each with the reason.","needs":"The finance inbox, purchase orders, your supplier list and read access to the accounting system.","impact":["$9.40 to $2.78","cost per invoice, average team against the best"],"stake":"Fake invoices and changed bank details cost US businesses $3.05 billion in 2025, about $123,000 per reported case.","src":[["Ardent Partners, AP metrics 2025","https://www.apexanalytix.com/resources/blog/ardent-partners-key-ap-metrics-2025/"],["FBI IC3 Internet Crime Report 2025","https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf"]],"steps":[{"label":"Read each invoice and pull out its details"},{"label":"Match it with its purchase order and receipt"},{"label":"Suggest the account code"},{"label":"Flag duplicates and any change of bank details"},{"label":"Approve the payment run","detail":null,"approval":true,"approvalLabel":"You approve the run"},{"label":"Post the approved invoices"}]},{"id":"month-end","p":"accountant","high":true,"name":"Month-end close","icon":"calendarCheck","purpose":"Use it in the last and first week of every month.","summary":"Desk matches every bank and card line to the ledger, lists what does not match with the likely reason, and drafts the accruals and adjusting entries. It keeps the close checklist up to date as it goes.","gets":"Finished reconciliations, a list of open items and draft journal entries for your approval.","needs":"The bank and card feeds, the ledger and your close checklist.","impact":["20 to 50 hours","a month on bank reconciliation alone"],"stake":"Half of finance teams take 6 working days or more to close. Unmatched lines are where wrong postings and unrecorded spend stay hidden.","src":[["Ledge month-end close benchmarks 2025, 100 teams","https://www.ledge.co/content/month-end-close-benchmarks-for-2025"]],"steps":[{"label":"Pull the bank, card and ledger data"},{"label":"Match the lines and list what does not match"},{"label":"Draft the accruals and adjusting entries"},{"label":"Post the entries","detail":null,"approval":true,"approvalLabel":"You approve each entry"},{"label":"Update the checklist and write the close summary"}]},{"id":"tax-check","p":"accountant","name":"Tax filing check","icon":"receipt","purpose":"Use it before each GST, VAT, TDS or withholding filing date.","summary":"Desk matches your purchase register with what suppliers reported to the tax portal and lists every gap that would cost you a tax credit. It keeps the filing dates for each entity, with what a late filing would cost.","ge :"Send the follow-ups","detail":null,"approval":true,"approvalLabel":"You approve before they go"}]},{"id":"call-follow-up","p":"sales","high":true,"name":"Call follow-up","icon":"reply","purpose":"Use it right after every customer call.","summary":"Desk turns your call notes or the recording into a follow-up email, the next steps and the CRM updates. It flags deals where the buyer has gone quiet.","gets":"A draft follow-up in your inbox and a CRM that is up to date without typing.","needs":"Call recordings or notes, the CRM and your email.","impact":["13 hours","a week spent looking for basic information in the CRM"],"stake":"Won deals see about 8 emails a week, lost deals about 2. Poor CRM data costs a company 16 deals a quarter on average.","src":[["Validity, State of CRM Data 2025","https://www.prnewswire.com/news-releases/validity-releases-state-of-crm-data-management-in-2025-report-revealing-disconnect-between-data-quality-and-ai-implementation-302499899.html"],["Gong Labs","https://www.gong.io/blog/the-signal-all-winning-deals-have-in-common"]],"steps":[{"label":"Read the call notes"},{"label":"Pull out the next steps, people and dates"},{"label":"Update the deal in the CRM"},{"label":"Draft the follow-up email"},{"label":"Send the follow-up","detail":null,"approval":true,"approvalLabel":"You approve before it goes"}]},{"id":"pre-call","p":"sales","high":true,"name":"Account brief","icon":"fileText","purpose":"Use it before a first meeting or a first message to a new account.","summary":"Desk reads up on the company, the people and their recent news, and writes a one-page brief with their likely problems and questions worth asking. It drafts the first message too.","gets":"A one-page brief and a draft first message.","needs":"The account name, its CRM history and the web.","impact":["34%","less time on account research with AI"],"stake":"Two in three B2B buyers would rather not talk to a salesperson at all, so the first message has to be worth reading.","src":[["Salesforce State of Sales 2026","https://www.salesforce.com/news/stories/state-of-sales-report-announcement-2026/"],["Gartner, March 2026","https://www.gartner.com/en/newsroom/press-releases/2026-03-09-gartner-sales-survey-finds-67-percent-of-b2b-buyers-prefer-a-rep-free-experience"]],"steps":[{"label":"Pull the CRM history"},{"label":"Read up on the company and the people"},{"label":"Write the brief and the questions"},{"label":"Draft the first message"},{"label":"Send the message","detail":null,"approval":true,"approvalLabel":"You approve before it goes"}]},{"id":"pipeline","p":"sales","name":"Weekly pipeline review","icon":"chart","purpose":"Use it before the weekly forecast call.","summary":"Desk checks every open deal for silence, missing next steps and close dates that slipped. It writes a risk list and a draft forecast note.","gets":"A deal-by-deal risk list and a forecast you can defend.","needs":"The CRM pipeline and email and calendar activity.","impact":["45%","of sales leaders trust their own forecast (2020 survey)"],"stake":"Slipping deals are caught before the quarter-end surprise.","src":[["Gartner, 2020","https://www.gartner.com/en/newsroom/press-releases/2020-02-12-gartner-says-less-than-50--of-sales-leaders-and-selle"]],"steps":[{"label":"Pull the open deals"},{"label":"Check each for activity and dates"},{"label":"Flag the deals at risk"},{"label":"Draft the forecast note"},{"label":"Share the forecast","detail":null,"approval":true,"approvalLabel":"You sign it off"}]},{"id":"weekly-report","p":"marketer","high":true,"name":"Weekly performance report","icon":"chart","purpose":"Use it every week or month to report on campaigns.","summary":"Desk pulls the results from your ads, website and email into one report and explains what changed and why. It suggests where to move the budget.","gets":"A one-page report with the reasons behind each change and what to do next.","needs":"Your ad accounts, web analytics and email tool.","impact":["14.5 hours","a week spent collecting and managing data"],"stake":"Marketing budgets have held at 7.7% of company revenue, so every wasted week of spend costs more.","src":[["Treasure Data, via Coupler.io","https://blog.coupler.io/why-marketing-teams-need-automation/"],["Gartner CMO Spend Survey 2025","https://www.gartner.com/en/newsroom/press-releases/2025-05-12-gartner-2025-cmo-spend-survey-reveals-marketing-budgets-have-flatlined-at-seven-percent-of-overall-company-revenue"]],"steps":[{"label":"Pull the numbers from each channel"},{"label":"Compare them with last period and the targets"},{"label":"Explain the biggest changes"},{"label":"Suggest budget moves"},{"label":"Move the budget","detail":null,"approval":true,"approvalLabel":"You approve any change"}]},{"id":"launch-pack","p":"marketer","high":true,"name":"One piece, every channel","icon":"megaphone","purpose":"Use it when one long piece, like a webinar, report or post, needs to go out everywhere.","summary":"Desk turns one source piece into posts, emails and short scripts that fit each channel and your voice, in Korean and English. It builds the publishing calendar.","gets":"A content pack for each channel and a calendar, ready for review.","needs":"The source piece, your voice rules and your channel list.","impact":["10 to 14 hours","a week back, for a third of marketers using AI"],"stake":"Half of marketers post the same thing on every platform, which wastes the reach each one offers.","src":[["HubSpot State of Marketing 2026","https://blog.hubspot.com/marketing/hubspot-blog-marketing-industry-trends-report"]],"steps":[{"label":"Read the source piece"},{"label":"Pull out the key points and quotes"},{"label":"Draft for each channel, in both languages"},{"label":"Build the calendar"},{"label":"Publish","detail":null,"approval":true,"approvalLabel":"You approve before anything goes live"}]},{"id":"ai-visibility","p":"marketer","name":"Search and AI answers check","icon":"search","purpose":"Use it every month on the questions your customers ask.","summary":"Desk runs your key questions in search and in AI assistants and records where you appear and where competitors do. It suggests page fixes and new content.","gets":"A visibility scorecard and a ranked list of fixes.","needs":"Your list of questions, your site analytics and Search Console.","impact":["34.5%","fewer clicks for top results when an AI answer appears above them"],"stake":"Lost traffic is caught before it shows up as fewer leads.","src":[["Ahrefs, 300,000 keywords, 2025","https://ahrefs.com/blog/ai-overviews-reduce-clicks/"]],"steps":[{"label":"Run the questions"},{"label":"Record where you and competitors appear"},{"label":"Compare with last month"},{"label":"Suggest fixes"},{"label":"Change the pages","detail":null,"approval":true,"approvalLabel":"You approve before they go live"}]},{"id":"research-brief","p":"consultant","high":true,"name":"Research brief","icon":"bookOpen","purpose":"Use it at the start of a project or before a client meeting.","summary":"Desk gathers public and internal material on the client, its market and its competitors and writes a brief where every claim has a source. It lists the open questions and the experts worth calling.","gets":"A 3 to 5 page brief with sources, and a list of questions.","needs":"The client name, the project scope, your firm's past work and the web.","impact":["Up to 20%","less time preparing for meetings"],"stake":"Every claim carries its source, so mistakes are caught before the client sees them.","src":[["McKinsey, Lilli","https://www.mckinsey.com/about-us/new-at-mckinsey-blog/meet-lilli-our-generative-ai-tool"]],"steps":[{"label":"Turn the scope into questions"},{"label":"Gather the sources"},{"label":"Pull out the facts and figures, with sources"},{"label":"Write the brief"},{"label":"Check the sources","detail":null,"approval":true,"approvalLabel":"You check before the client sees it"}]},{"id":"interview-synthesis","p":"consultant","high":true,"name":"Interviews to findings","icon":"messages","purpose":"Use it after a round of client or expert interviews.","summary":"Desk reads every interview, groups what people said into themes with how often each came up, and keeps the strongest quotes with who said them. It drafts the findings pages.","gets":"A themes table with quotes, and draft findings pages.","needs":"The interview notes or transcripts and the project questions.","impact":["25% faster","with 40% better work, on tasks AI suits"],"stake":"The same study found people did worse when AI was used outside what it does well. That is why a person checks the findings.","src":[["BCG and Harvard, 758 consultants","https://aiinstitute.hbs.edu/navigating-the-jagged-technological-frontier/"]],"steps":[{"label":"Read every interview"},{"label":"Tag the themes"},{"label":"Count them and pull the quotes"},{"label":"Mark where people disagree"},{"label":"Draft the findings","detail":null,"approval":true,"approvalLabel":"You approve before the client sees them"}]},{"id":"client-status","p":"consultant","name":"Weekly client status","icon":"checklist","purpose":"Use it at the end of every project week.","summary":"Desk collects progress, risks and decisions from the team's notes, trackers and email. It drafts the client status note and next week's plan.","gets":"A draft status note and a list of open decisions.","needs":"The project tracker, meeting notes and email.","impact":["3 to 4 hours","a day back, reported by half of consultants"],"stake":"Scope creep and slipping dates are caught early. (The hours are self-reported.)","src":[["Consultancy.uk survey","https://www.consultancy.uk/news/42760/90-of-management-consultants-use-gen-ai-in-their-daily-tasks"]],"steps":[{"label":"Gather the updates"},{"label":"List progress against the plan"},{"label":"Flag risks and decisions needed"},{"label":"Draft the note"},{"label":"Send it to the client","detail":null,"approval":true,"approvalLabel":"You approve before it goes"}]},{"id":"feedback-digest","p":"pm","high":true,"name":"Customer feedback digest","icon":"inbox","purpose":"Use it every week, or before planning.","summary":"Desk gathers feedback from support tickets, sales notes, reviews and interviews and groups it into themes by how many people and how much revenue each touches. It links each theme to the roadmap.","gets":"A ranked list of themes with quotes, counts and the accounts affected.","needs":"The support tool, CRM notes, reviews and interview notes.","impact":["Half","of product teams lack time for planning and analysis"],"stake":"Most features are rarely used, so building from real feedback saves engineering time.","src":[["Atlassian State of Product 2026","https://www.atlassian.com/blog/announcements/state-of-product-2026"]],"steps":[{"label":"Gather the feedback"},{"label":"Group it into themes"},{"label":"Weigh each theme by people and revenue"},{"label":"Match it to the roadmap"},{"label":"Set the priorities","detail":null,"approval":true,"approvalLabel":"You decide"}]},{"id":"spec-draft","p":"pm","high":true,"name":"Spec first draft","icon":"draft","purpose":"Use it when an idea is approved and needs a written spec.","summary":"Desk drafts the spec from your notes, the related feedback and past specs: the problem, goals, scope, edge cases and open questions. It lists the questions for engineering and design.","gets":"A spec ready for review, and a list of questions.","needs":"Your notes, the feedback digest and past specs.","impact":["2 hours","a day back, mostly on writing"],"stake":"Most teams bring engineers in late. A clear first draft gets their input sooner.","src":[["Atlassian State of Product 2026","https://www.atlassian.com/blog/announcements/state-of-product-2026"]],"steps":[{"label":"Read the notes and related feedback"},{"label":"Draft the spec"},{"label":"List the edge cases and open questions"},{"label":"Share it with the team","detail":null,"approval":true,"approvalLabel":"You approve before it is shared"}]},{"id":"release-notes","p":"pm","name":"Release notes","icon":"package","purpose":"Use it at each release or the end of each sprint.","summary":"Desk reads what shipped and writes release notes for customers and an update for leaders, in Korean and English. It flags anything that needs a help article.","gets":"Customer release notes, an internal update and a list of help articles to write.","needs":"Your issue tracker and the release list.","impact":["2 to 3 hours","back each release (our estimate)"],"stake":"Customers find out what changed from you, not from a bug.","src":[],"steps":[{"label":"Pull what shipped"},{"label":"Group it by what it changes for customers"},{"label":"Draft the notes and the update"},{"label":"Publish","detail":null,"approval":true,"approvalLabel":"You approve before it goes live"}]},{"id":"pr-review","p":"engineer","high":true,"name":"Code review first pass","icon":"code","purpose":"Use it every time a pull request is opened.","summary":"Desk reviews the change for bugs, missing tests, security issues and style, and leaves clear comments. It writes a short summary so the person reviewing can start faster.","gets":"Review comments and a summary, before a person picks the change up.","needs":"Access to the repository and your team's review rules.","impact":["7 vs 19 hours","before a change is picked up, fastest teams against slowest"],"stake":"Most developers say AI answers are often almost right, so a person always makes the merge call.","src":[["LinearB, pull request pickup time","https://linearb.io/blog/pull-request-pickup-time"],["Stack Overflow Developer Survey 2025","https://survey.stackoverflow.co/2025/ai"]],"steps":[{"label":"Read the change and its context"},{"label":"Check for bugs, tests and security issues"},{"label":"Write the comments and the summary"},{"label":"Merge","detail":null,"approval":true,"approvalLabel":"You approve the merge"}]},{"id":"incident","p":"engineer","high":true,"name":"Incident triage and write-up","icon":"alert","purpose":"Use it when an alert fires or something breaks in production.","summary":"Desk gathers the logs, recent changes and past incidents and suggests the likely cause and fix. Once it is fixed, Desk drafts the write-up and the follow-up tickets.","gets":"A triage note in minutes, then a write-up with a timeline.","needs":"Logs and monitoring, the deploy history and your issue tracker.","impact":["$4,537","a minute, the average cost of an incident"],"stake":"Incidents take 175 minutes to resolve on average, about $794,000 each. Every minute of faster diagnosis counts. (2024 survey.)","src":[["PagerDuty cost of incidents, 2024","https://www.pagerduty.com/newsroom/study-cost-of-incidents/"]],"steps":[{"label":"Gather the signals and recent changes"},{"label":"Suggest the likely cause"},{"label":"Roll back or change production","detail":null,"approval":true,"approvalLabel":"You approve any change"},{"label":"Draft the timeline and write-up"},{"label":"Open the follow-up tickets"}]},{"id":"tests-docs","p":"engineer","name":"Tests and docs catch-up","icon":"fileCode","purpose":"Use it when code is short on tests or its docs are out of date.","summary":"Desk writes tests for code that has none and updates the docs to match the code. It opens them as changes for review.","gets":"New tests and updated docs, ready to review.","needs":"Access to the repository and where the docs live.","impact":["10+ hours","a week lost by half of developers to work around the code"],"stake":"Docs and tests are where developers most plan to use AI next.","src":[["Atlassian Developer Experience 2025","https://www.atlassian.com/blog/developer/developer-experience-report-2025"]],"steps":[{"label":"Find code with no tests or stale docs"},{"label":"Write the tests"},{"label":"Update the docs"},{"label":"Merge","detail":null,"approval":true,"approvalLabel":"You approve the merge"}]}];
  const PB = Object.fromEntries(PLAYBOOKS.map(p => [p.id, p]));
  const Sec = ({ title, trailing, lede, children }) => h('section', { className: 'wk-sec' }, [
    h(R.SectionMark, { key: 'm', label: title, as: 'heading', level: 2, trailing }),
    lede ? h('p', { key: 'l', className: 'wk-lede' }, lede) : null,
    h('div', { key: 'b', className: 'wk-sec__body' }, children)
  ]);
  const Back = ({ to, children }) => h('a', { className: 'wk-back', href: to }, [ic('arrowLeft', 14), children]);
  function PlaybookRow({ p, project }) {
    return h(R.PlaybookRow, { href: '#playbook/' + p.id + (project ? '@' + project : ''), icon: ic(p.icon, 16), name: p.name, summary: p.summary,
      steps: p.steps, impact: p.impact, highImpact: p.high, owner: p.team ? p.owner : undefined });
  }
  function PlaybooksView() {
    const [prof, setProf] = React.useState('accountant');
    const mine = PLAYBOOKS.filter(p => p.p === prof);
    const high = mine.filter(p => p.high);
    const team = PLAYBOOKS.filter(p => p.team);
    const label = PROFESSIONS.find(x => x[0] === prof)[1];
    return h('div', { className: 'wk-page' }, [
      h('p', { key: 'l', className: 'wk-lede wk-lede--top' }, 'A playbook is work Desk does the same way every time. It follows your steps in order and stops wherever you want to check. Run one in any project, or put it on a schedule and let it run while you work on something else.'),
      h(Sec, { key: 't', title: 'Your team\'s playbooks', trailing: h(R.Button, { size: 'sm', variant: 'secondary', iconLeft: ic('plus', 14) }, 'New playbook') },
        h('div', { className: 'wk-stack' }, team.map(p => h(PlaybookRow, { key: p.id, p })))),
      h(Sec, { key: 'e', title: 'Examples to start from', lede: 'Written with people who do the work. Copy one, then change the steps to fit how your team works.' }, [
        h('div', { key: 'f', className: 'wk-prof' }, h(R.Select, { label: 'Show examples for', value: prof, onChange: (e) => setProf(e.target.value), options: PROFESSIONS.map(([value, label]) => ({ value, label })) })),
        (() => { const left = mine.filter(p => !p.team).sort((x, y) => (y.high ? 1 : 0) - (x.high ? 1 : 0));
          return left.length ? h('div', { key: 'r', className: 'wk-stack' }, left.map(p => h(PlaybookRow, { key: p.id, p })))
            : h('p', { key: 'r', className: 'wk-lede' }, 'Your team already uses all three examples for ' + (label === 'HR' ? 'HR teams' : label.toLowerCase() + 's') + '. They are listed above.'); })()
      ])
    ]);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(shell('playbooks', { title: 'Playbooks', meta: '3 saved by your team, 30 examples for 10 professions' }, h(PlaybooksView)));
</script>
