<!-- @dsCard group="Product screens" height=900 width=1320 page -->
<div id="root" style="font-family: var(--font-sans); color: var(--ink-primary);"></div>
<style>
  #root, .rr-shell { min-height: 100vh; }
  .wk-page { display: flex; flex-direction: column; gap: 48px; padding: 8px 0 64px; }
  .wk-page > .wk-back + * { margin-top: -28px; }
  .wk-lede { margin: -4px 0 0; font-size: 14px; line-height: 22px; color: var(--ink-secondary); max-width: 640px; }
  .wk-lede--top { margin: 0; font-size: 15px; line-height: 24px; }
  .wk-dim { color: var(--ink-muted); font-weight: 400; }
  .wk-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border-subtle); }
  .wk-list > li { border-bottom: 1px solid var(--border-subtle); }
  .wk-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) 72px 72px 200px 84px 64px; align-items: center; gap: 16px; padding: 16px 8px;
    color: var(--ink-primary); text-decoration: none; border-radius: var(--radius-md); }
  a.wk-row:hover { background: var(--surface-sunken); }
  .wk-row__icon { display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: var(--radius-md); background: var(--surface-sunken); color: var(--ink-secondary); }
  .wk-row--tight .wk-row__icon { width: 28px; height: 28px; background: transparent; }
  .wk-row__main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .wk-row__main b { font-size: 15px; line-height: 22px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wk-row--tight .wk-row__main b { font-size: 14px; font-weight: 500; }
  .wk-row__main span { font-size: 13px; line-height: 19px; color: var(--ink-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wk-row__fig { font-size: 13px; color: var(--ink-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wk-row__fig b { color: var(--ink-primary); font-weight: 600; }
  .wk-row__pb { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk-row__pb svg { color: var(--ink-brand); flex: none; }
  .wk-row__when { font-size: 13px; color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .wk-people { display: inline-flex; align-items: center; }
  .wk-people { gap: 4px; }
  .wk-more { font-size: 12px; color: var(--ink-secondary); margin-left: 6px !important; }
  .wk-wait__meta .wk-dim { margin-left: auto; }
  .wk-plist .wk-dim { margin-left: auto; font-size: 12px; }
  @media (max-width: 1100px) {
    .wk-row { grid-template-columns: 36px minmax(0, 1fr) 72px 84px 64px; }
    .wk-row__fig:nth-of-type(4), .wk-row__pb { display: none; }
  }
  @media (max-width: 720px) {
    .wk-page { gap: 36px; }
    .wk-starts, .wk-feats, .wk-scheds { grid-template-columns: minmax(0, 1fr); }
    .wk-attn__i { flex-wrap: wrap; align-items: flex-start; }
    .wk-attn__t { flex: 1 1 calc(100% - 52px); }
    .wk-attn__i > .rr-btn { margin-left: 52px; }
    .wk-row { grid-template-columns: 36px minmax(0, 1fr) auto; }
    .wk-row > .wk-row__fig, .wk-row > .wk-people { display: none; }
    .wk-log__i { grid-template-columns: 20px minmax(0, 1fr); }
    .wk-log__when { grid-column: 2; order: 3; }
    .wk-log__icon { order: 0; } .wk-log__main { order: 1; } .wk-log__i > .rr-task { grid-column: 2; order: 2; }
  }
</style>

ject with the signed contracts in it (scanned PDFs are fine) and the calendar.","impact":["9%","of a contract's value is lost, on average, to poor contract management"],"stake":"It stops contracts renewing on their own when nobody chose to keep them. (The 9% is an older, widely quoted figure.)","src":[["World Commerce & Contracting, via Juro","https://juro.com/learn/contract-value-leakage"]],"steps":[{"label":"Read each contract and pull out its dates and terms"},{"label":"Build the renewal calendar"},{"label":"Warn you 60 and 30 days before each notice deadline"},{"label":"Choose which to end or renegotiate","detail":null,"approval":true,"approvalLabel":"You pick which to end"},{"label":"Draft the notice letters","detail":"To the notice address in each contract"},{"label":"Send the letters","detail":null,"approval":true,"approvalLabel":"You approve before they go"}],"owner":"Han Jiwoo","runs":"run 34 times","lastRun":"Today, 08:14","team":true,"cadence":"Every Monday, 08:00 KST"}];
