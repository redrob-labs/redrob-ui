  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  const ic = (n, s) => h(I[n], { width: s || 15, height: s || 15 });

  const VIEWS = [
    { who: 'Gemini 3.1 Pro', said: 'Agrees. The exception names "any breach of Clause 13 (Data)", so data breaches have no limit.' },
    { who: 'DeepSeek V4 Pro', said: 'Sees it differently. It reads 11.4(c) as covering only gross negligence, so ordinary data breaches stay under the limit.' }
  ];
  function Demo() {
    const [settled, setSettled] = React.useState(false);
    return h('div', { style: { maxWidth: '760px' } }, h(R.Message, { role: 'assistant', author: 'Desk' }, h('div', null, [
      h('p', { key: 1, style: { margin: '0 0 10px' } }, ['Clause 8.2 makes your promise to cover their losses unlimited. ',

        ' Clause 14.1 lets them end the agreement on 30 days\' notice.']),
      settled ? h('p', { key: 2, style: { margin: 0, fontSize: '13px', color: 'var(--ink-secondary)' } }, 'Asked Claude Opus 5.5 to settle point 1. It is rereading Clause 11.4 with both readings in front of it.') : null
    ])));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
