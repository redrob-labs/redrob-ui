<!-- @dsCard group="Agent chat" height=390 -->
<div id="root" style="padding: 32px; font-family: var(--font-sans); color: var(--ink-primary);"></div>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  const ic = (n, s) => h(I[n], { width: s || 15, height: s || 15 });

  const NOTES = h('ul', { style: { margin: 0, paddingLeft: '18px' } }, [
    h('li', { key: 1 }, 'Our standard notice period is 60 days'), h('li', { key: 2 }, 'Seorin\'s lawyer prefers a Word redline'), h('li', { key: 3 }, 'Our standard limit is 12 months of fees')]);

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gap: '28px', maxWidth: '760px' } }, [
    h(R.Message, { key: 'a', role: 'assistant', author: 'Desk',
      footer: h(R.AnswerReceipt, { items: [
        { id: 'm', icon: ic('sparkle', 14), label: 'Claude Opus 5.5', sub: 'by Redrob Auto',
          detail: ['Redrob Auto read your message as reviewing contracts. It chose Claude Opus 5.5, 3rd on the Redrob Leaderboard, the highest place that runs in Desk. ', h('a', { key: 'l', href: '#model-guide' }, 'See the ranking')] },
        { id: 'n', icon: ic('bookOpen', 14), label: '3 notes used', sub: 'shared memory', detail: NOTES },
        { id: 'o', icon: ic('compare', 14), tone: 'differ', label: 'Checked by DeepSeek V4 Pro and Gemini 3.1 Pro', sub: 'see one point differently',
          detail: ['They agree with the rest, see the marked point differently, and added one point at the end. It ran because this is reviewing contracts. ', h('a', { key: 'l', href: '#second-opinion' }, 'Compare side by side')] }
      ] }) }, 'Three clauses move risk onto you: 8.2, 11.4 and 14.1.'),
    h(R.Message, { key: 'b', role: 'assistant', author: 'Desk',
      footer: h(R.AnswerReceipt, { items: [
        { id: 'm', icon: ic('pin', 14), label: 'DeepSeek V4 Pro', sub: 'your choice', detail: 'You chose DeepSeek V4 Pro for this chat. It is 6th for reviewing contracts this month.' },
        { id: 'o', busy: true, label: 'Getting a second opinion from Opus 5.5 and Gemini 3.1 Pro' }
      ] }) }, 'Two clauses move risk onto you: 8.2 and 11.4.')
  ]));
</script>
