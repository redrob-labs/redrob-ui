<!-- @dsCard group="Product screens" height=1000 width=1320 page -->
<div id="root" style="font-family: var(--font-sans); color: var(--ink-primary);"></div>
<style>
  #root, .rr-shell { min-height: 100vh; }
  .wk-auto { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 12px; border: 0; border-radius: var(--radius-full);
    background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-primary); cursor: pointer; white-space: nowrap; }
  .wk-auto:hover { background: var(--surface-sunken); }
  .wk-auto svg:first-child { color: var(--ink-brand); }
  .wk-new { min-height: calc(100vh - 140px); display: flex; flex-direction: column; justify-content: center; padding: 40px 0 12vh; }
  .wk-new__in { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; }
  .wk-new__hello { display: flex; align-items: center; gap: 8px; margin: 0 0 8px 4px; font-size: 15px; line-height: 22px; font-weight: 600; color: var(--ink-secondary); }
  .wk-new__hello svg { color: var(--ink-brand); }
  .wk-new__line { margin: 0 0 28px 4px; font-family: var(--font-serif); font-size: 36px; line-height: 44px; font-weight: 400; letter-spacing: -0.01em; }
  @media (max-width: 720px) { .wk-explain { grid-template-columns: minmax(0, 1fr); } .wk-new__line { font-size: 28px; line-height: 36px; } .wk-new { min-height: 0; } }
</style>
<script>
  /* Desk, a new chat: a hello, one line, the composer with its status line. Sample data: a Seoul law firm on Mon 28 Sep 2026. */

  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  const ic = (n, s, p) => h(I[n], Object.assign({ width: s || 15, height: s || 15, 'aria-hidden': true }, p));
  const MARK_L = '/_blob/4acde94cf2db0da7cc2c123d4cafbb66';
  const MARK_D = '/_blob/9d0341656bedf8aaacf9584371167cb2';
  const SYMBOL = '/_blob/a35853f38695b112ff00dae9ab62fdce';
  const NOW = new Date(2026, 8, 28, 10, 0); /* Mon 28 Sep 2026, 10:00 Seoul */
  const RECENT = [{"id":"indemnity","label":"Seorin indemnity cap","meta":"2h"},{"id":"notice","label":"Notice by email - valid?","meta":"Mon"},{"id":"hanbit-exh","label":"Hanbit exhibit list","meta":"Fri"}];
  /* The Desk sidebar: five places, recent chats, then how Desk works for you, each with its state. */
  function nav(current, apps) {
    const it = (id, label, icon, meta) => ({ id, label, icon: ic(icon), meta, href: '#' + id, current: current === id });
    return [it('chat', 'Chat', 'message'), it('projects', 'Projects', 'folder'), it('playbooks', 'Playbooks', 'checklist'), it('scheduled', 'Scheduled', 'calendarClock', '2'), it('history', 'History', 'history'),
      { heading: 'Recent' }].concat(RECENT.map(c => ({ id: 'r-' + c.id, label: c.label, meta: c.meta, href: '#chat' })), [
      { heading: 'How Desk works for you' },
      it('guide', 'Model Guide', 'chart', 'Auto'), it('connectors', 'Connectors', 'plug', String(apps || 6)),
      it('privacy', 'Privacy protection', 'shieldCheck', 'High'), it('memory', 'Memory', 'bookOpen', 'On'), it('opinion', 'Second opinion', 'compare', 'On')]);
  }
  function shell(current, p, body, apps) {
    return h(R.AppShell, Object.assign({ product: 'Desk', mark: MARK_L, markDark: MARK_D, symbol: SYMBOL, collapsible: true, defaultCollapsed: false,
      theme: h(R.ThemeSwitch, { size: 'sm' }), nav: nav(current, apps), navLabel: 'Desk' }, p), body);
  }
  const ME = 'Han Jiwoo';
  const PROJECTS = [{"id":"seorin","name":"Seorin MSA","about":"Master services agreement with Seorin Bio","files":18,"chats":6,"playbooks":["first-review"],"active":"2h ago","people":["Han Jiwoo","Lee Dohyun","Kim Minjun"]},{"id":"supplier","name":"Q3 supplier contracts","about":"Every supplier contract up for renewal this year","files":41,"chats":3,"playbooks":["renewal-sweep"],"active":"Mon","people":["Han Jiwoo","Choi Yuna"]},{"id":"hanbit","name":"Hanbit v. Daeil","about":"Seoul Central District Court, damages claim","files":126,"chats":11,"playbooks":["deadline-tracker"],"active":"Today","people":["Han Jiwoo","Lee Dohyun","Park Sera","Jung Hoon"]},{"id":"nara","name":"Nara Series B diligence","about":"Acting for the lead investor","files":212,"chats":4,"playbooks":[],"active":"18 Sep","people":["Han Jiwoo","Kim Minjun"]},{"id":"clauses","name":"Our clause library","about":"The positions the firm has agreed, clause by clause","files":64,"chats":2,"playbooks":[],"active":"9 Sep","people":["Everyone at the firm"]}];
  const PJ = Object.fromEntries(PROJECTS.map(p => [p.id, p]));
  function statusItems(mem, setMem, project) {
    const pj = project && PJ[project];
    return [
      { id: 'privacy', icon: ic('shieldCheck'), tone: 'safe', name: 'Privacy', value: 'High', level: { n: 2, of: 3 }, live: 'Running on this laptop',
        panel: h(R.PrivacyProtection, { level: 'high', summary: '214 private details kept from AI this week.', foot: [h('span', { key: 'a' }, 'Set to High for your whole team by your admin, Park Hyunjin.')] }) },
      { id: 'memory', icon: ic('bookOpen'), tone: mem === 'none' ? 'plain' : 'on', name: 'Memory', value: mem === 'none' ? 'Off for this chat' : 'On for every AI',
        panel: h(R.MemoryScope, { value: mem, onChange: setMem,
          options: [
            pj ? { value: 'project', label: 'This project', detail: '12 notes about ' + pj.name, summary: '12 notes, kept by Redrob outside any AI, so they work with every model.' } : null,
            { value: 'all', label: 'All my work', detail: '43 notes, including how you like to work', summary: '43 notes, kept by Redrob outside any AI, so they work with every model.' },
            { value: 'none', label: 'Off for this chat', detail: 'Nothing is read, and nothing is saved', summary: 'Off for this chat. Your notes are still there for your other chats.', off: true }
          ].filter(Boolean),
          foot: [h('span', { key: 'a' }, 'Only this chat changes. Your notes stay yours, and you can download them at any time.'), h('a', { key: 'b', href: '#memory' }, 'Open Memory')] }) },
      { id: 'opinion', icon: ic('compare'), tone: 'on', name: 'Second opinion', value: 'When it matters',
        panel: h(R.SecondOpinionSetting, { defaultValue: 'auto' }) }
    ];
  }
  function Compose({ project, placeholder, onSend }) {
    const pj = project && PJ[project];
    const [mem, setMem] = React.useState(pj ? 'project' : 'all');
    return h(R.Composer, {
      placeholder: placeholder || 'Ask Desk, or type / to run a playbook',
      context: pj ? h('span', { className: 'rr-composer__chip' }, [ic('folder', 14), h('span', { key: 't' }, pj.name)]) : undefined,
      tools: h('button', { type: 'button', className: 'wk-auto', title: 'How Redrob Auto chooses', onClick: () => {  } }, [ic('sparkle', 14), 'Redrob Auto', ic('chevronDown', 12)]),
      status: h(R.ComposerStatus, { items: statusItems(mem, setMem, project) }),
      onSubmit: onSend
    });
  }

  const GREETING = "Every border starts with one question.";
  function ChatHome() {
        const line = GREETING;
    return h('div', { className: 'wk-new' }, h('div', { className: 'wk-new__in' }, [
      h('p', { key: 'h', className: 'wk-new__hello' }, [ic('sparkle', 18), 'Hello, Jiwoo']),
      h('h2', { key: 'l', className: 'wk-new__line' }, line),
      h(Compose, { key: 'c' })
    ]));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(shell('chat', { title: 'New chat' }, h(ChatHome)));
</script>
