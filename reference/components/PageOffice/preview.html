    return h('div', null, [
      HEADER,

      h(R.Band, { key:'hero', product:'office', threshold:true }, h(R.Hero, {
        mark: h('span', { className:'ox-product' }, [h('img', { key:'i', src: OFFICE_ICON, alt:'' }), h('span', { key:'n' }, 'Redrob Office')]),
        lede: 'Change one number and every document, sheet and deck that used it is out of date. Edit a fact, a decision or an assumption, and Office finds everything that depends on it, recalculates the figures, rewrites the documents and updates the decks.',
        action: h(R.Button, { size:'lg', shape:'pill', emphasis:true }, 'Try Office free'),
        secondary: 'See how it works', secondaryHref: '#how',
        foot: 'Free to start. Works on the Word, Excel, PowerPoint and Google files you already have.',
        media: h(R.Figure, { className:'ox-fig', caption:'One edited forecast, and the four places Office found that used it.', credit:'Redrob Office, as designed' }, RENDER)
      }, h(R.Display, { level:2, as:'h1', lang:'en' }, 'Your work updates itself.'))),

      h(R.Band, { key:'how', id:'how', ground:'sunken', product:'office' }, h('div', { className:'ox-split' }, [
        side('Change it once.', 'Office keeps track of where every fact is used, so one edit reaches all of them.'),
        h('ol', { key:'l', className:'ox-steps' }, STEPS.map(s => h('li', { key:s[0] }, h('div', null, [h('b', { key:'t' }, s[0]), h('span', { key:'d' }, s[1])]))))
      ])),

      /* The three capabilities, a band each: copy and a render of it working on Office's work. */
      ...CAPS.map((c, i) => h(R.Band, { key: c.key, product:'office', ground: i % 2 ? 'sunken' : 'base' },
        h('div', { className: 'ox-cap' + (i % 2 ? ' ox-cap--flip' : '') }, [
          h('div', { key:'b', className:'ox-cap__body' }, [
            h(R.SectionMark, { key:'m', label: [c.name, 'Under every Redrob product'] }),
            h('h2', { key:'h', className:'ox-cap__h' }, c.head),
            h('p', { key:'p', className:'ox-cap__p' }, [c.copy + ' ', h('b', { key:'b' }, c.beat)]),
            h('p', { key:'i', className:'ox-cap__in' }, 'In Office'),
            h('ul', { key:'l', className:'ox-cap__pts' }, c.points.map(pt => h('li', { key:pt }, [h('span', { key:'i' }, TICK()), h('span', { key:'t' }, pt)])))
          ]),
          h(R.Figure, { key:'f', className:'ox-fig', caption: c.caption, credit:'Redrob Office, as designed' }, c.render)
        ]))),

      h(R.Band, { key:'files', ground:'sunken', product:'office' }, h('div', { className:'ox-split' }, [
        side('Opens the files you already have', 'No import and no new format. Office edits each file in place, in its own format.'),
        h('ul', { key:'l', className:'ox-files' }, FILES.map(f => h('li', { key:f[0] }, [h('b', { key:'n' }, f[0]), h('span', { key:'d' }, f[1])])))
      ])),

      h(R.Band, { key:'stories', product:'office' }, [
        h(R.SectionMark, { key:'m', label:'Customer stories' }),
        h('div', { key:'h', className:'ox-head', style:{ marginTop:'24px' } }, h('h2', { className:'ox-h2' }, 'What changes when the work updates itself')),
        h('div', { key:'g', className:'ox-stories' }, [
          h(R.CustomerStory, { key:'a', customer:'Tidewell Freight', sector:'Logistics, Busan',
          figure:'2 hours', figureLabel:'to reissue the quarterly pack after a forecast changed, across 38 files',
          period:'Measured over the second quarter of 2026, against 3 days for the same work in 2025.',
          quote: h(R.Quote, { cite:'Jiwon Seo', role:'Head of Finance, Tidewell Freight' },
            'We changed the fuel assumption at four and the board had a correct pack by six.'),
          href:'#' }, h('p', null, 'One forecast feeds thirty-eight sheets, memos and decks. When fuel prices moved, Office found every file that used the old figure and had each one redone for review the same afternoon.')),
          h('div', { key:'m', className:'ox-stories__more' }, [
          h(R.CustomerStory, { key:'b', customer:'Orrin & Vale', sector:'Accounting, Noida',
            figure:'0', figureLabel:'stale figures found in client reports at year-end review, from 14 the year before',
            period:'Year-end close 2025, across 212 client reports.', href:'#' },
            h('p', null, 'Rates and thresholds changed twice during the close. Each change reached every report that used it, with the source on every number.')),
          h(R.CustomerStory, { key:'c', customer:'Kestrelmark Capital', sector:'Investment, New York',
            figure:'11 decks', figureLabel:'brought up to date from one change to a valuation model',
            period:'Measured on one fund update in August 2026, against five days of checking by hand for the same update in March.', href:'#' },
            h('p', null, 'A revised discount rate used to mean a week of checking decks by hand. Office listed the eleven that used it and redrew the charts in each.'))
          ])
        ])
      ]),

      h(R.Band, { key:'close', ground:'brand', product:'office' }, h('div', { className:'ox-close' }, [
        h('h2', { key:'h' }, 'Stop updating the same number twice.'),
        h('div', { key:'r', className:'ox-close__row' }, [
          h(R.Button, { key:'b', size:'lg', shape:'pill', emphasis:true }, 'Try Office free'),
          h('a', { key:'a', className:'ox-close__link', href:'#' }, 'See pricing →')
        ])
      ])),

      FOOTER
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Screen));
</script>
