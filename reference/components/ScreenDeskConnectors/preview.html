<style>

    return [it('chat', 'Chat', 'message'), it('projects', 'Projects', 'folder'), it('playbooks', 'Playbooks', 'checklist'), it('scheduled', 'Scheduled', 'calendarClock', '2'), it('history', 'History', 'history'),
      { heading: 'Recent' }].concat(RECENT.map(c => ({ id: 'r-' + c.id, label: c.label, meta: c.meta, href: '#chat' })), [
      { heading: 'How Desk works for you' },

      it('privacy', 'Privacy protection', 'shieldCheck', 'High'), it('memory', 'Memory', 'bookOpen', 'On'), it('opinion', 'Second opinion', 'compare', 'On')]);
  }

      theme: h(R.ThemeSwitch, { size: 'sm' }), nav: nav(current, apps), navLabel: 'Desk' }, p), body);
  }
  const CONNECTORS = [{"id":"outlook","name":"Outlook","maker":"Microsoft 365","cat":"Email and calendar","icon":"mail","does":"Reads and drafts email, and checks your calendar."},{"id":"teams","name":"Microsoft Teams","maker":"Microsoft 365","cat":"Chat and meetings","icon":"videoCall","does":"Reads the chats and channels you pick, and meeting transcripts."},{"id":"onedrive","name":"OneDrive and SharePoint","maker":"Microsoft 365","cat":"Files","icon":"folder","does":"Finds and reads files in the folders you choose."},{"id":"gmail","name":"Gmail","maker":"Google Workspace","cat":"Email","icon":"mail","on":true,"does":"Reads and drafts email."},{"id":"gdrive","name":"Google Drive","maker":"Google Workspace","cat":"Files","icon":"folderOpen","on":true,"does":"Finds and reads files in the folders you choose."},{"id":"gcal","name":"Google Calendar","maker":"Google Workspace","cat":"Calendar","icon":"calendar","on":true,"does":"Checks when people are free and adds events."},{"id":"zoom","name":"Zoom","maker":"Zoom Communications","cat":"Meetings","icon":"videoCall","on":true,"does":"Reads meeting recordings and transcripts to write notes and follow-ups."},{"id":"slack","name":"Slack","maker":"Salesforce","cat":"Chat","icon":"messages","on":true,"does":"Reads the channels you pick and sums up threads."},{"id":"dropbox","name":"Dropbox","maker":"Dropbox","cat":"Files","icon":"archive","does":"Finds and reads files in the folders you choose."},{"id":"github","name":"GitHub","maker":"GitHub","cat":"Code","icon":"code","does":"Reads code, pull requests and issues, and leaves review comments."},{"id":"notion","name":"Notion","maker":"Notion Labs","cat":"Docs and notes","icon":"note","does":"Reads pages and databases, and drafts edits."},{"id":"salesforce","name":"Salesforce","maker":"Salesforce","cat":"CRM","icon":"users","does":"Reads accounts, deals and contacts."},{"id":"hubspot","name":"HubSpot","maker":"HubSpot","cat":"CRM and marketing","icon":"target","does":"Reads contacts, deals and email history."},{"id":"jira","name":"Jira","maker":"Atlassian","cat":"Project tracking","icon":"kanban","does":"Reads tickets and sprints, and drafts new tickets and updates."},{"id":"confluence","name":"Confluence","maker":"Atlassian","cat":"Docs and notes","icon":"book","does":"Reads your team's pages and drafts new ones."},{"id":"docusign","name":"Docusign","maker":"Docusign","cat":"E-signature","icon":"signature","on":true,"does":"Checks where each agreement stands and prepares envelopes."},{"id":"box","name":"Box","maker":"Box","cat":"Files","icon":"folderPlus","does":"Finds and reads files in the folders you choose."},{"id":"asana","name":"Asana","maker":"Asana","cat":"Project tracking","icon":"checklist","does":"Reads projects and tasks, and drafts updates and new tasks."},{"id":"quickbooks","name":"QuickBooks","maker":"Intuit","cat":"Accounting","icon":"receipt","does":"Reads invoices, bills and reports, and drafts entries."},{"id":"zoho","name":"Zoho","maker":"Zoho","cat":"CRM, mail and books","icon":"building","does":"Reads CRM records, invoices and mail, and drafts changes."}];
  const USES = {"lawyer":["gdrive","gmail","gcal","docusign"],"accountant":["gmail","gdrive","outlook"],"recruiter":["gmail","gcal","zoom"],"hr":["gmail","gdrive","slack","docusign"],"founder":["gdrive","gmail","hubspot"],"sales":["salesforce","gmail","zoom"],"marketer":["hubspot","gdrive","slack"],"consultant":["gdrive","zoom","gmail"],"pm":["jira","notion","slack"],"engineer":["github","jira","slack"]};
  const ConnCtx = React.createContext(null);
  function useConn() { return React.useContext(ConnCtx); }
  const Sec = ({ title, trailing, lede, children }) => h('section', { className: 'wk-sec' }, [

    h('div', { key: 'b', className: 'wk-sec__body' }, children)

  const Back = ({ to, children }) => h('a', { className: 'wk-back', href: to }, [ic('arrowLeft', 14), children]);
  function ConnectorTile({ c }) {

    return h('li', null, h(R.ConnectorCard, { name: c.name, maker: c.maker, category: c.cat, icon: ic(c.icon, 20), logo: c.logo, description: c.does, connected: !!conn[c.id],

  function ConnectorsView() {
    const { conn } = useConn();

    const mine = CONNECTORS.filter(c => conn[c.id] && match(c)), rest = CONNECTORS.filter(c => !conn[c.id] && match(c));
    return h('div', { className: 'wk-page' }, [
      h('p', { key: 'l', className: 'wk-lede wk-lede--top' }, 'Connect the apps you already work in. Each playbook reaches only the apps you add to it, and anything that sends, posts, signs or pays waits for your approval.'),

  }


  ReactDOM.createRoot(document.getElementById('root')).render(h(function Root() { const [conn, setConn] = React.useState(() => Object.fromEntries(CONNECTORS.map(c => [c.id, !!c.on])));
      return h(ConnCtx.Provider, { value: { conn, setConn } }, shell('connectors', { title: 'Connectors', meta: 'The apps Desk can reach, and what each may do' }, h(ConnectorsView), Object.values(conn).filter(Boolean).length)); }));
</script>
