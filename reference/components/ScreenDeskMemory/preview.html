<!-- @dsCard group="Product screens" height=1180 width=1320 page -->
<div id="root" style="font-family: var(--font-sans); color: var(--ink-primary);"></div>
<style>
  #root, .rr-shell { min-height: 1000px; }
  /* The three pages share one layout: a large status card, the figures, then sections. */
  .page { display: flex; flex-direction: column; gap: 56px; padding: 12px 0 72px; max-width: 920px; }
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin: -24px 0 0;
          border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle); }
  .fig { padding: 20px 24px 20px 0; }
  .fig + .fig { padding-left: 24px; border-left: 1px solid var(--border-subtle); }
  .fig dt { font-size: 13px; line-height: 19px; color: var(--ink-secondary); }
  .fig dd { margin: 6px 0 0; font-size: 32px; line-height: 38px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sec { display: flex; flex-direction: column; gap: 20px; }
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
  .cols--2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .col b { display: block; font-size: 15px; line-height: 22px; font-weight: 600; margin-bottom: 6px; }
  .col p { margin: 0; font-size: 14px; line-height: 23px; color: var(--ink-secondary); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; counter-reset: s; }
  .steps li { counter-increment: s; font-size: 14px; line-height: 23px; color: var(--ink-secondary); }
  .steps li::before { content: counter(s); display: inline-flex; width: 26px; height: 26px; margin-bottom: 10px; align-items: center; justify-content: center;
                      border-radius: 50%; background: var(--surface-sunken); font-size: 12px; font-weight: 600; color: var(--ink-primary); }
  .steps b { display: block; font-size: 15px; margin-bottom: 4px; color: var(--ink-primary); }
  .bar .rr-tabs { max-width: 100%; overflow-x: auto; }
  .bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
  .admin { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-secondary); }
  .thread { display: flex; flex-direction: column; gap: 18px; }
  .note { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; line-height: 20px; color: var(--ink-secondary); }
  .note > span:first-child { display: inline-flex; color: var(--status-success); }
  .note a { font-weight: 600; color: var(--ink-brand); text-decoration: none; }
  .answer p { margin: 0 0 10px; } .answer p:last-child { margin: 0; }
  @media (max-width: 720px) {
    .page { gap: 40px; } .figs, .cols, .cols--2, .steps { grid-template-columns: minmax(0, 1fr); }
    .fig + .fig { padding-left: 0; border-left: 0; border-top: 1px solid var(--border-subtle); }
  }
</style>
<script>
  const h = React.createElement;
  const R = window.Redrob;
  const I = R.icons;
  const ic = (n, s) => h(I[n], { width: s || 15, height: s || 15 });

  const MARK_L = '/_blob/4acde94cf2db0da7cc2c123d4cafbb66';
  const MARK_D = '/_blob/9d0341656bedf8aaacf9584371167cb2';
  /* The Desk sidebar: five places, recent chats, then how Desk works for you, each with its state. */
  function deskNav(current) {
    const it = (id, label, icon, meta) => ({ id, label, icon: h(I[icon], { width: 15, height: 15 }), meta, href: '#' + id, current: current === id });
    return [it('chat', 'Chat', 'message'), it('projects', 'Projects', 'folder'), it('playbooks', 'Playbooks', 'checklist'), it('scheduled', 'Scheduled', 'calendarClock', '2'), it('history', 'History', 'history'),
      { heading: 'Recent' }, { id: 'r1', label: 'Seorin MSA', meta: '2h', href: '#chat', current: current === 'recent' }, { id: 'r2', label: 'Notice by email - valid?', meta: 'Mon', href: '#chat' }, { id: 'r3', label: 'Hanbit exhibit list', meta: 'Fri', href: '#chat' },
      { heading: 'How Desk works for you' },
      it('guide', 'Model Guide', 'chart', 'Auto'), it('connectors', 'Connectors', 'plug', '6'),
      it('privacy', 'Privacy protection', 'shieldCheck', 'High'), it('memory', 'Memory', 'bookOpen', 'On'), it('opinion', 'Second opinion', 'compare', 'On')];
  }
  function nav(current) { return deskNav(current === 'chat' ? 'recent' : current); }

  const Figs = ({ items }) => h('dl', { className: 'figs' }, items.map(([v, l], i) => h('div', { key: i, className: 'fig' }, [h('dt', { key: 'l' }, l), h('dd', { key: 'v' }, v)])));
  const Sec = ({ title, children }) => h('section', { className: 'sec' }, [h(R.SectionMark, { key: 'm', label: title, as: 'heading', level: 2 }), h('div', { key: 'b' }, children)]);
  const Cols = ({ items, two }) => h('div', { className: two ? 'cols cols--2' : 'cols' }, items.map(([t, d], i) => h('div', { key: i, className: 'col' }, [h('b', { key: 'b' }, t), h('p', { key: 'p' }, d)])));
  function shell(current, title, meta, body, foot) {
    return h(R.AppShell, { product: 'Desk', mark: MARK_L, markDark: MARK_D, symbol: '/_blob/a35853f38695b112ff00dae9ab62fdce', collapsible: true, defaultCollapsed: false, theme: h(R.ThemeSwitch, { size: 'sm' }),
      nav: nav(current), title, meta, foot }, body);
  }

  const NOTES = {
    project: [
      { text: 'Our standard limit is 12 months of fees', source: 'You told it on 3 Sep', readBy: 'Claude Opus 5.5, DeepSeek V4 Pro, Gemini 3.1 Pro' },
      { text: 'Seorin\'s lawyer prefers changes as a Word redline', source: 'Learned in a chat on 11 Sep', readBy: 'Claude Opus 5.5, Kimi K3' },
      { text: 'Korean law, disputes heard in Seoul', source: 'Learned in a chat on 11 Sep', readBy: 'Claude Opus 5.5, Gemini 3.1 Pro' },
      { text: 'Our standard notice period is 60 days', source: 'Learned today', readBy: 'Claude Opus 5.5' },
      { text: 'Person 1 is Seorin\'s lawyer', source: 'Learned on 11 Sep. The name itself stays on your laptop.', readBy: 'Claude Opus 5.5, Kimi K3' }
    ],
    you: [
      { text: 'Write in American English, with short dashes', source: 'You told it on 28 Aug', readBy: 'Every AI you used' },
      { text: 'Show exchange rates beside converted amounts', source: 'You told it on 30 Aug', readBy: 'Claude Opus 5.5, GPT-6 Astra' },
      { text: 'Keep edits to your drafts small', source: 'You told it on 1 Sep', readBy: 'Claude Opus 5.5, Gemini 3.1 Pro' }
    ],
    team: [
      { text: 'House style: numbered clauses, defined terms in bold', source: 'Set by your admin on 20 Aug', readBy: 'Every AI', locked: true },
      { text: 'Never send ID or bank numbers', source: 'Set by your admin on 20 Aug', readBy: 'Every AI', locked: true }
    ]
  };
  function Page() {
    const [tab, setTab] = React.useState('project');
    return h('div', { className: 'page' }, [
      h(R.StatusCard, { key: 'h', size: 'lg', tone: 'brand', icon: ic('bookOpen', 32), title: 'One memory for every AI' },
        'Redrob keeps your memory outside any AI, so Claude, GPT, Gemini, Kimi or whatever comes next all read the same notes. Switching AI never means starting over.'),
      h(Figs, { key: 'f', items: [['12', 'Notes for Seorin MSA'], ['31', 'Notes on how you work'], ['6', 'AIs that read them this month']] }),
      h(Sec, { key: 'n', title: 'The notes' }, [
        h('div', { key: 'b', className: 'bar' }, [
          h(R.Tabs, { key: 't', label: 'Whose notes', value: tab, onChange: setTab, variant: 'pill', items: [
            { id: 'project', label: 'This project', count: 12 }, { id: 'you', label: 'How you work', count: 31 }, { id: 'team', label: 'Your team', count: 2 }] }),
          h(R.Button, { key: 'd', size: 'sm', variant: 'secondary', iconLeft: ic('download', 14) }, 'Download all notes')
        ]),
        h(R.MemoryList, { key: 'l', items: NOTES[tab] })
      ]),
      h(Sec, { key: 'x', title: 'Good to know' }, h(Cols, { items: [
        ['Not locked to one AI', 'Most AI apps keep what they learn inside one AI, from one company. Yours stays with Redrob, and you can download it at any time.'],
        ['You stay in charge', 'Say "remember this" or "forget that" in any chat. Every new note is shown under the answer, with Undo.'],
        ['Private stays private', 'It remembers "Person 1 is Seorin\'s lawyer". The real name never leaves your laptop.']
      ] }))
    ]);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(shell('memory', 'Memory', 'Redrob Multi-Model Memory, Seorin MSA', h(Page)));
</script>
