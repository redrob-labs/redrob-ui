etween the clause and the foreseeable loss.\n2. [2021] Reduction refused. HELPS. Negotiated clause between two represented companies; bargaining power was treated as decisive.\n3. [2019] Reduced. HURTS. A single sum for every breach was treated as a penalty.\n4. [2018] Refused. HELPS. The court declined to use actual loss with hindsight.\n5. [2016] Partly reduced. MIXED.\n\nTwo of the five turn on bargaining power, which favors the supplier here: the agreement was negotiated over three drafts with counsel on both sides. The tiered structure of §12 also answers the risk in decision 3.","illustrative":true},"runHref":"#"}]},{"id":"memo","label":"Write briefs and memos","title":"Top 5 for a lawyer writing briefs and memos","usage":"Priced for about 10 briefs or memos a month.","basis":"Priced for about 10 briefs or memos a month","prompt":"Draft a two-page memo to the client on whether they can end the Seorin supply agreement early for convenience. Use the research in the Research folder and the contract itself. Lead with the answer.","weights":{"quality":0.6,"reliability":0.2,"speed":0.05,"cost":0.15},"formula":"Score = 0.60 Quality + 0.20 Reliability + 0.05 Speed + 0.15 Cost. Speed = 100 x sqrt(fastest median / this median). Cost = 100 x sqrt(cheapest month / this month).","picks":[{"id":"memo-1","model":"GPT-6 Astra","short":"GPT-6 Astra","harness":"Redrob Desk","effort":{"label":"High","level":3,"of":5},"why":"Writes a tight memo from the whole record, and states the weak points of our own position.","monthly":24.0,"score":{"quality":95,"reliability":96,"speed":59.2,"cost":61.2,"ci":1.2},"measured":{"quality":"rubric 9.5 / 10 (experts 9.6, judges 9.3)","reliability":"96 of 100 runs passed","speed":"median 10.0 min a task","cost":"$24 a month"},"facts":[["Model ID","gpt-6-astra"],["Effort setting","reasoning.effort: \"high\""],["Harness","Redrob Desk"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.5 at High effort"],["Price per 1M tokens","$10 in, $50 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.76"]],"note":"Put the strongest argument against our position on page one, as the rubric asks.","sample":{"output":"MEMO\nTo: Litigation team\nRe: Limit of liability in the Seorin agreement\n\n1. Question\nDoes the 12-month limit in Clause 11.4 cover a data breach?\n\n2. Short answer\nProbably not. The exception in 11.4(c) names \"any breach of Clause 13 (Data)\".\n\n3. The weak point in our position\nIf 11.4(c) is read as limited to gross negligence, ordinary breaches stay under the limit. Two appellate decisions support that reading.","illustrative":true},"runHref":"#"},{"id":"memo-2","model":"Claude Opus 5.5","short":"Opus 5.5","harness":"Redrob Desk","effort":{"label":"High","level":3,"of":5},"why":"Writes long, structured argument from the research already in your folder.","monthly":22.0,"score":{"quality":90,"reliability":95,"speed":76.4,"cost":64.0,"ci":1.5},"measured":{"quality":"rubric 9.0 / 10 (experts 9.2, judges 8.8)","reliability":"95 of 100 runs passed","speed":"median 6.0 min a task","cost":"$22 a month"},"facts":[["Model ID","claude-opus-5-5"],["Effort setting","effort: \"high\""],["Harness","Redrob Desk"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.5 at High effort"],["Price per 1M tokens","$4 in, $20 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.74"]],"note":"Led with the answer, cited the contract and the research folder for every step.","sample":{"output":"MEMORANDUM\n\nTo: Min-ji Park, General Counsel\nFrom: [Firm]\nRe: Ending the Seorin supply agreement early\nDate: 24 September 2026\n\nShort answer\nYes. The agreement can be ended for convenience under §18.2 on 90 days' written notice, with a break fee of 15% of the fees remaining for the Term. The break fee is likely to be enforced as written.\n\n1. What the contract says\n§18.2 allows either party to end the agreement for convenience on 90 days' written notice. §18.3 sets the break fee at 15% of the fees that would have been payable for the rest of the Term. On current figures that is about KRW 189m if notice is given on 1 October.\n\n2. Why the break fee is likely to stand\nThe fee was negotiated over three drafts between two companies with counsel (drafts in the Research folder). The decisions collected in the Research folder treat negotiation between sophisticated parties as the strongest reason not to reduce an agreed sum. The fee is also tiered by the time remaining, which answers the main ground on which courts have reduced such clauses.\n\n3. Risks\n- Seorin may argue that notice given before the 12-month mark breaches §18.2(b). The clause does not say so, but the point should be addressed in the notice.\n- Work in progress: §18.5 requires payment for work completed to the date of termination.\n\n4. Recommendation\nGive notice under §18.2 on or after 1 October, state the break fee and the work-in-progress figure, and propose a handover plan. A draft notice is attached.","illustrative":true},"runHref":"#"},{"id":"memo-3","model":"Gemini 3.1 Pro","short":"Gemini 3.1 Pro","harness":"Gemini Enterprise for Legal","effort":{"label":"High","level":3,"of":3},"why":"Built to check the citations in a brief against their sources.","monthly":12.2,"score":{"quality":83,"reliability":88,"speed":73.4,"cost":85.9,"ci":1.8},"measured":{"quality":"rubric 8.3 / 10 (experts 8.4, judges 8.1)","reliability":"88 of 100 runs passed","speed":"median 6.5 min a task","cost":"$12 a month"},"facts":[["Model ID","gemini-3.1-pro-preview"],["Effort setting","thinking_level: \"high\""],["Harness","Gemini Enterprise for Legal"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.5 at High effort"],["Price per 1M tokens","$2 in, $12 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.72"]],"note":"Checked every citation against its source; the prose needed more editing.","sample":{"output":"The client may t from notice. §18.3 fixes the fee by reference to remaining fees, with a sliding scale by year.\n\nCould the fee be reduced? Courts reduce agreed sums that are out of proportion to foreseeable loss. Three features favor enforcement here: (a) negotiation between represented parties, (b) the sliding scale, and (c) the fee's link to the supplier's committed costs, which Seorin documented during negotiation. Against enforcement: the fee applies even if Seorin re-lets the capacity quickly. This is the strongest argument Seorin would have.\n\nTiming. Notice given before the first anniversary is not prohibited, but §18.2(b)'s reference to \"the initial period\" is ambiguous; a court could read it as a minimum term. We recommend waiting until 1 October to remove the point.\n\nCosts. Break fee about KRW 189m; work in progress under §18.5, estimated at KRW 40m to 55m.\n\nNext step. Approve the draft notice attached; we will send it on 1 October.","illustrative":true},"runHref":"#"},{"id":"memo-5","model":"GPT-6 Sol","short":"GPT-6 Sol","harness":"ChatGPT Work","effort":{"label":"Medium","level":2,"of":5},"why":"For short memos, at the lowest price here.","monthly":9.0,"score":{"quality":70,"reliability":80,"speed":100.0,"cost":100.0,"ci":2.4},"measured":{"quality":"rubric 7.0 / 10 (experts 7.2, judges 6.8)","reliability":"80 of 100 runs passed","speed":"median 3.5 min a task","cost":"$9.00 a month"},"facts":[["Model ID","gpt-6-sol"],["Effort setting","reasoning.effort: \"medium\""],["Harness","ChatGPT Work"],["Runs","20 prompts x 5 runs"],["Tokens a task","250k in, 40k out, x1.0 at Medium effort"],["Price per 1M tokens","$2 in, $10 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","kappa 0.68"]],"note":"Fine for a short letter; not enough analysis for a memo of record.","sample":{"output":"Hi Min-ji,\n\nYou can end the agreement early under §18.2 with 90 days' notice. You will owe a break fee of 15% of the remaining fees (about KRW 189m), plus payment for work 0 over the Term.\n\"Term\" means 24 months from the Effective Date, unless ended earlier under clause 18.\n\"Customer Materials\" means any data, drawings or specifications the Customer provides.\n\n2. Services. The Supplier shall provide the Services in Schedule 2 to the standard in Schedule 3.\n\n6. Payment. The Customer shall pay undisputed invoices within thirty (30) days of receipt.\n\n11. Confidentiality. Obligations survive for five (5) years after the Term.\n\n14. Limitation of liability\n14.1 Each party's total liability shall not exceed the Fees paid in the twelve (12) months before the claim.\n14.2 Nothing limits liability for fraud, death or personal injury, or breach of clause 11.\n\n15. Intellectual property. Customer Materials and all deliverables made from them belong to the Customer.\n\n18. Termination. Either party may end this Agreement for convenience on ninety (90) days' notice, subject to clause 18.3.\n\nOpen points from the term sheet (3)\n1. Acceptance testing: the term sheet is silent. We have used our standard 10-day test in Schedule 4.\n2. Data residency: not addressed. Bracketed option in clause 12.\n3. Step-in rights: not addressed. Not included; confirm whether wanted.","illustrative":true},"runHref":"#"},{"id":"draft-4","model":"GPT-6 Sol","short":"GPT-6 Sol","harness":"ChatGPT Work","effort":{"label":"Medium","level":2,"of":5},"why":"Good on standard agreements, for a fraction of the cost.","monthly":6.6,"score":{"quality":82,"reliability":88,"speed":94.3,"cost":100.0,"ci":1.5},"measured":{"quality":"rubric 8.2 / 10 (experts 8.3, judges 8.0)","reliability":"88 of 100 runs passed","speed":"median 4.5 min a task","cost":"$6.60 a month"},"facts":[["Model ID","gpt-6-sol"],["Effort setting","reasoning.effort: \"medium\""],["Harness","ChatGPT Work"],["Runs","20 prompts x 5 runs"],["Tokens a task","150k in, 25k out, x1.0 at Medium effort"],["Price per 1M tokens","$2 in, $10 out"],["Graders","2 lawyers, 3 model judges"],["Judge agreement","ka
